services:
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.server
    env_file:
      - ../.env
    ports:
      - '3000:3000'

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
      args:
        VITE_API_BASE_URL: http://localhost:3000/api/v1
    depends_on:
      - api
    ports:
      - '8080:80'
