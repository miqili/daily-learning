services:
  mysql:
    image: mysql:8.4
    container_name: daily-learning-mysql
    restart: unless-stopped

    env_file:
      - ../.env

    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.server

    container_name: daily-learning-api
    restart: unless-stopped

    env_file:
      - ../.env

    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USERNAME: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      DB_DATABASE: ${MYSQL_DATABASE}

    depends_on:
      mysql:
        condition: service_healthy

    expose:
      - '3000'

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web

    container_name: daily-learning-web
    restart: unless-stopped

    args:
      VITE_API_BASE_URL: /api/v1

    depends_on:
      - api

    ports:
      - '8080:80'

volumes:
  mysql_data:
